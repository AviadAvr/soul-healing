name: Deploy to GitHub Pages

# Builds the Next.js + TinaCMS site and publishes the static export to GitHub Pages.
# Runs on Linux, which avoids the Windows-only `EEXIST` file-copy bug in
# `next build` (output: export) seen during local Windows builds.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TinaCMS + Next.js static export)
        env:
          # Provided via repo Settings → Secrets and variables → Actions.
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NEXT_PUBLIC_JAWG_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_TOKEN }}
          GITHUB_BRANCH: main
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

