name: Build check

# Runs on pull requests to verify the site builds before merging.
# This is the status check to mark as "required" on the main branch so that
# auto-merge only completes when the build passes. It does NOT deploy.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TinaCMS + Next.js static export)
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NEXT_PUBLIC_JAWG_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_TOKEN }}
          GITHUB_BRANCH: main
        run: npm run build

